[coverage:report]
# Floor for plain `coverage report` (statement coverage only), used for local
# dev. CI (python-quality job) enforces this same 95% floor for *both*
# statement and branch coverage independently, via
# .github/scripts/check_coverage_floor.py - coverage.py's own fail_under
# can't express two separate floors like that. Ratchet both up as coverage
# improves - see issue #8. Currently ~99.9%/~99.7% on this branch; the floor
# is kept a few points below that as margin rather than pinned to the exact
# number, so a small future regression doesn't need an immediate floor bump.
fail_under = 95
