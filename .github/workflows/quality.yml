name: Quality

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Advisory Ruff and Pylint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff advisory scan
        run: |
          set +e
          ruff check . > ruff-report.txt
          status=$?
          printf 'Ruff exit status: %s\n' "$status" | tee -a ruff-report.txt
          exit 0

      - name: Run Pylint advisory scan
        run: |
          set +e
          pylint opds_abs run.py > pylint-report.txt 2>&1
          status=$?
          printf '\nPylint exit status: %s\n' "$status" | tee -a pylint-report.txt
          exit 0

      - name: Upload static-analysis reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            ruff-report.txt
            pylint-report.txt
          retention-days: 14

  python-quality:
    name: Python tests and repository checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so the coverage-comment step can diff against the PR base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression tests with coverage
        run: |
          coverage run --source=opds_abs -m unittest discover -s tests -v
          coverage report -m
          coverage xml

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Build coverage comment body
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          {
            echo "### Coverage report"
            echo
            echo "**Changed files**"
            echo '```'
            CHANGED_PY_FILES=$(git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" HEAD -- '*.py' | grep '^opds_abs/' || true)
            if [ -n "$CHANGED_PY_FILES" ]; then
              # setup.cfg sets fail_under=90, which makes `coverage report` exit
              # non-zero when the reported subset is below it; that enforcement
              # already happened in the previous step, so ignore it here - this
              # step is purely informational.
              coverage report -m --include="$(echo "$CHANGED_PY_FILES" | paste -sd, -)" || true
            else
              echo "No opds_abs/*.py files changed in this PR."
            fi
            echo '```'
            echo
            echo "**Overall**"
            echo '```'
            coverage report -m || true
            echo '```'
          } > coverage_comment.md

      - name: Post coverage comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-comment -->';
            const body = `${marker}\n${fs.readFileSync('coverage_comment.md', 'utf8')}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  container-quality:
    name: Build and validate container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build container image
        run: docker build --tag opds-abs:ci .
