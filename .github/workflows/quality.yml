name: Quality

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Advisory Ruff and Pylint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff advisory scan
        run: |
          set +e
          ruff check . > ruff-report.txt
          status=$?
          printf 'Ruff exit status: %s\n' "$status" | tee -a ruff-report.txt
          exit 0

      - name: Run Pylint advisory scan
        run: |
          set +e
          pylint opds_abs run.py > pylint-report.txt 2>&1
          status=$?
          printf '\nPylint exit status: %s\n' "$status" | tee -a pylint-report.txt
          exit 0

      - name: Upload static-analysis reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            ruff-report.txt
            pylint-report.txt
          retention-days: 14

  python-quality:
    name: Python tests and repository checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so the coverage-comment step can diff against the PR base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression tests with coverage
        run: |
          coverage run --source=opds_abs -m unittest discover -s tests -v
          coverage report -m
          coverage xml

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Run branch coverage on PR head
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # A dedicated data file so this run - and the branch coverage it
          # adds - never overwrites the statement-only .coverage data that
          # coverage.xml and the fail_under gate above already used.
          COVERAGE_FILE: .coverage.metrics
        run: |
          coverage run --branch --source=opds_abs -m unittest discover -s tests -q
          coverage json -o coverage_head.json

      - name: Run tests with coverage on PR base
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          git worktree add /tmp/pr-base "${{ github.event.pull_request.base.sha }}"
          cd /tmp/pr-base
          python -m pip install -r requirements-dev.txt
          coverage run --branch --source=opds_abs -m unittest discover -s tests -q || true
          coverage json -o "${GITHUB_WORKSPACE}/coverage_base.json"

      - name: Build coverage comment body
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          CHANGED_PY_FILES=$(git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" HEAD -- '*.py' | grep '^opds_abs/' || true)
          python .github/scripts/coverage_diff.py "$CHANGED_PY_FILES"

      - name: Post coverage comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-comment -->';
            const body = `${marker}\n${fs.readFileSync('coverage_comment.md', 'utf8')}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  container-quality:
    name: Build and validate container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build container image
        run: docker build --tag opds-abs:ci .
