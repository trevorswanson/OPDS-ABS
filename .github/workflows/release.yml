name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set outputs
        id: vars
        run: |
          repo_lowercase="${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          major="${major_minor%.*}"
          echo "repo_lowercase=$repo_lowercase" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build . -t ghcr.io/${{ steps.vars.outputs.repo_lowercase }}:${{ github.ref_name }}

      - name: Tag release image
        run: |
          image="ghcr.io/${{ steps.vars.outputs.repo_lowercase }}"
          docker tag "$image:${{ github.ref_name }}" "$image:${{ steps.vars.outputs.version }}"
          docker tag "$image:${{ github.ref_name }}" "$image:${{ steps.vars.outputs.major_minor }}"
          docker tag "$image:${{ github.ref_name }}" "$image:${{ steps.vars.outputs.major }}"
          docker tag "$image:${{ github.ref_name }}" "$image:latest"

      - name: Push Docker images
        run: |
          image="ghcr.io/${{ steps.vars.outputs.repo_lowercase }}"
          docker push "$image:${{ github.ref_name }}"
          docker push "$image:${{ steps.vars.outputs.version }}"
          docker push "$image:${{ steps.vars.outputs.major_minor }}"
          docker push "$image:${{ steps.vars.outputs.major }}"
          docker push "$image:latest"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
