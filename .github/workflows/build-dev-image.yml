name: Build and publish dev image

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: vars
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "repo_lowercase=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build . -t ghcr.io/${{ steps.vars.outputs.repo_lowercase }}:dev-${{ steps.vars.outputs.sha_short }}

      - name: Push Docker image
        run: docker push ghcr.io/${{ steps.vars.outputs.repo_lowercase }}:dev-${{ steps.vars.outputs.sha_short }}
