name: Validate master promotion source

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Require promotion from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "master may only be updated by a pull request from dev"
            exit 1
          fi
          echo "Valid promotion: dev -> master"
